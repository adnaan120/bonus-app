<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>USDT Bonus Claim</title>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Adsgram SDK -->
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    body {
      background-color: #0b0e14;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    /* Progress Indicators */
    .progress-bar {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 25px;
    }

    .progress-dot {
      width: 40px;
      height: 4px;
      background-color: #2b313d;
      border-radius: 4px;
      transition: background-color 0.3s ease;
    }

    .progress-dot.active {
      background-color: #0088cc;
    }

    .progress-dot.completed {
      background-color: #27ae60;
    }

    .question-count {
      color: #8a96a3;
      font-size: 13px;
      letter-spacing: 1px;
      font-weight: 600;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    .math-expression {
      font-size: 48px;
      font-weight: 800;
      margin-bottom: 35px;
      letter-spacing: 2px;
    }

    /* Answer Buttons */
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .option-btn {
      background-color: #171d26;
      border: 1px solid #232c3a;
      color: #ffffff;
      font-size: 22px;
      font-weight: 600;
      padding: 16px;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      outline: none;
    }

    .option-btn:active {
      transform: scale(0.97);
      background-color: #242e3d;
    }

    /* Success / Verified Screen */
    .verified-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.4s ease;
    }

    .icon-circle {
      width: 90px;
      height: 90px;
      background: radial-gradient(circle, #1abc9c 0%, #16a085 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 45px;
      margin-bottom: 20px;
      box-shadow: 0 0 25px rgba(26, 188, 156, 0.4);
    }

    .verified-title {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .amount-text {
      color: #2ecc71;
      font-size: 36px;
      font-weight: 800;
      margin-bottom: 15px;
    }

    .sub-text {
      color: #8a96a3;
      font-size: 14px;
      margin-bottom: 40px;
    }

    .ok-btn {
      width: 100%;
      background-color: #0088cc;
      color: #ffffff;
      border: none;
      font-size: 18px;
      font-weight: 700;
      padding: 16px;
      border-radius: 14px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .ok-btn:active {
      background-color: #0077b5;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Math Quiz Screen -->
    <div id="quizScreen">
      <div class="progress-bar">
        <div class="progress-dot active" id="dot1"></div>
        <div class="progress-dot" id="dot2"></div>
      </div>
      <div class="question-count" id="qCount">QUESTION 1 OF 2</div>
      <div class="math-expression" id="expression">...</div>
      <div class="options-list" id="optionsContainer"></div>
    </div>

    <!-- Verified Success Screen -->
    <div id="verifiedScreen" class="verified-screen">
      <div class="icon-circle">🎉</div>
      <div class="verified-title">Verified!</div>
      <div class="amount-text">+0.003 USDT</div>
      <div class="sub-text">Tap OK to collect and close.</div>
      <button class="ok-btn" onclick="handleClaim()">OK</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // Adsgram Controller (Block ID: 45902)
    const AdController = window.Adsgram?.init({ blockId: "45902" });

    let currentStep = 1;
    let correctAnswer = 0;

    function generateQuestion() {
      const isAddition = Math.random() > 0.5;
      let num1, num2, answer;

      if (isAddition) {
        num1 = Math.floor(Math.random() * 15) + 2;
        num2 = Math.floor(Math.random() * 10) + 1;
        answer = num1 + num2;
        document.getElementById('expression').innerText = `${num1} + ${num2} = ?`;
      } else {
        num1 = Math.floor(Math.random() * 18) + 6;
        num2 = Math.floor(Math.random() * (num1 - 2)) + 1;
        answer = num1 - num2;
        document.getElementById('expression').innerText = `${num1} - ${num2} = ?`;
      }

      correctAnswer = answer;

      // Generate 2 wrong unique options
      let wrong1 = answer + (Math.random() > 0.5 ? 2 : -2);
      if (wrong1 === answer || wrong1 < 0) wrong1 = answer + 3;
      let wrong2 = answer + (Math.random() > 0.5 ? 4 : -3);
      if (wrong2 === answer || wrong2 === wrong1 || wrong2 < 0) wrong2 = answer + 5;

      const options = [answer, wrong1, wrong2].sort(() => Math.random() - 0.5);
      
      const container = document.getElementById('optionsContainer');
      container.innerHTML = '';

      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;
        btn.onclick = () => selectAnswer(opt);
        container.appendChild(btn);
      });
    }

    function selectAnswer(selected) {
      if (selected === correctAnswer) {
        if (currentStep === 1) {
          currentStep = 2;
          document.getElementById('dot1').className = 'progress-dot completed';
          document.getElementById('dot2').className = 'progress-dot active';
          document.getElementById('qCount').innerText = 'QUESTION 2 OF 2';
          generateQuestion();
        } else {
          // Both questions completed
          document.getElementById('quizScreen').style.display = 'none';
          document.getElementById('verifiedScreen').style.display = 'flex';
        }
      } else {
        // Wrong answer, generate new
        generateQuestion();
      }
    }

    // Marka OK la riixo
    async function handleClaim() {
      // 1. Isku day in aad xayeysiiska Adsgram furto
      if (AdController) {
        try {
          await AdController.show();
        } catch (e) {
          console.log("Ad skipped or failed:", e);
        }
      }

      // 2. U dir xogta bot-ka oo xir WebApp-ka
      if (tg) {
        tg.sendData(JSON.stringify({ action: "claim_bonus", amount: 0.003 }));
        tg.close();
      }
    }

    // Start quiz
    generateQuestion();
  </script>
</body>
  </html>
