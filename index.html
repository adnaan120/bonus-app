<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>USDT Bonus Claim</title>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; user-select: none; }
    body { background-color: #0b0e14; color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .container { width: 100%; max-width: 380px; text-align: center; }
    .progress-bar { display: flex; justify-content: center; gap: 10px; margin-bottom: 25px; }
    .progress-dot { width: 45px; height: 5px; background-color: #1e2633; border-radius: 4px; transition: background-color 0.3s ease; }
    .progress-dot.active { background-color: #0088cc; }
    .progress-dot.completed { background-color: #2ecc71; }
    .question-count { color: #8a96a3; font-size: 13px; letter-spacing: 1.5px; font-weight: 700; margin-bottom: 20px; text-transform: uppercase; }
    .math-expression { font-size: 52px; font-weight: 800; margin-bottom: 25px; letter-spacing: 2px; }
    .error-msg { color: #e74c3c; font-size: 14px; font-weight: 600; height: 20px; margin-bottom: 15px; visibility: hidden; }
    .options-list { display: flex; flex-direction: column; gap: 12px; }
    .option-btn { background-color: #161c26; border: 1.5px solid #232d3d; color: #ffffff; font-size: 24px; font-weight: 700; padding: 16px; border-radius: 14px; cursor: pointer; transition: all 0.2s ease; outline: none; }
    .option-btn.correct { background-color: #27ae60 !important; border-color: #2ecc71 !important; }
    .option-btn.wrong { background-color: #c0392b !important; border-color: #e74c3c !important; animation: shake 0.3s ease; }
    .screen { display: none; flex-direction: column; align-items: center; animation: fadeIn 0.4s ease; }
    .icon-circle { width: 90px; height: 90px; background: radial-gradient(circle, #2ecc71 0%, #27ae60 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 45px; margin-bottom: 20px; box-shadow: 0 0 30px rgba(46, 204, 113, 0.4); }
    .hourglass-icon { font-size: 65px; margin-bottom: 20px; }
    .screen-title { font-size: 22px; font-weight: 700; color: #d1d8e0; margin-bottom: 30px; }
    .verified-title { font-size: 32px; font-weight: 800; margin-bottom: 8px; }
    .amount-text { color: #2ecc71; font-size: 36px; font-weight: 800; margin-bottom: 12px; }
    .sub-text { color: #8a96a3; font-size: 14px; margin-bottom: 35px; }
    .btn-action { width: 100%; background-color: #0088cc; color: #ffffff; border: none; font-size: 18px; font-weight: 700; padding: 16px; border-radius: 14px; cursor: pointer; }
    .btn-action:active { background-color: #0077b5; }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <div class="container">
    <!-- 1. Math Quiz Screen -->
    <div id="quizScreen">
      <div class="progress-bar">
        <div class="progress-dot active" id="dot1"></div>
        <div class="progress-dot" id="dot2"></div>
      </div>
      <div class="question-count" id="qCount">QUESTION 1 OF 2</div>
      <div class="math-expression" id="expression">...</div>
      <div class="error-msg" id="errorMsg">❌ Wrong answer! Try again.</div>
      <div class="options-list" id="optionsContainer"></div>
    </div>

    <!-- 2. Verified Screen (Lacagta horay ayaa loogu shubay) -->
    <div id="verifiedScreen" class="screen">
      <div class="icon-circle">🎉</div>
      <div class="verified-title">Verified!</div>
      <div class="amount-text">+0.003 USDT</div>
      <div class="sub-text">Tap OK to watch ad & close.</div>
      <button class="btn-action" id="claimBtn" onclick="handleClaim()">OK</button>
    </div>

    <!-- 3. Not Ready Yet Screen -->
    <div id="notReadyScreen" class="screen">
      <div class="hourglass-icon">⏳</div>
      <div class="screen-title">Your bonus is not ready yet.</div>
      <button class="btn-action" onclick="closeApp()">Close</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    let AdController = null;
    try {
      if (window.Adsgram) {
        AdController = window.Adsgram.init({ blockId: "45902" });
      }
    } catch (err) {}

    let currentStep = 1;
    let correctAnswer = 0;
    let isProcessing = false;

    function checkCooldown() {
      const lastClaim = localStorage.getItem('last_claim_ts');
      const now = Date.now();
      if (lastClaim && (now - parseInt(lastClaim)) < 3600000) {
        document.getElementById('quizScreen').style.display = 'none';
        document.getElementById('verifiedScreen').style.display = 'none';
        document.getElementById('notReadyScreen').style.display = 'flex';
        return false;
      }
      return true;
    }

    function generateQuestion() {
      isProcessing = false;
      document.getElementById('errorMsg').style.visibility = 'hidden';
      const isAdd = Math.random() > 0.5;
      let n1, n2, ans;
      if (isAdd) {
        n1 = Math.floor(Math.random() * 12) + 3;
        n2 = Math.floor(Math.random() * 9) + 2;
        ans = n1 + n2;
        document.getElementById('expression').innerText = `${n1} + ${n2} = ?`;
      } else {
        n1 = Math.floor(Math.random() * 15) + 6;
        n2 = Math.floor(Math.random() * (n1 - 2)) + 1;
        ans = n1 - n2;
        document.getElementById('expression').innerText = `${n1} - ${n2} = ?`;
      }
      correctAnswer = ans;
      let w1 = ans + (Math.random() > 0.5 ? 2 : -2);
      if (w1 === ans || w1 < 0) w1 = ans + 3;
      let w2 = ans + (Math.random() > 0.5 ? 4 : -3);
      if (w2 === ans || w2 === w1 || w2 < 0) w2 = ans + 5;
      const opts = [ans, w1, w2].sort(() => Math.random() - 0.5);
      const cont = document.getElementById('optionsContainer');
      cont.innerHTML = '';
      opts.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;
        btn.onclick = () => handleAnswer(opt, btn);
        cont.appendChild(btn);
      });
    }

    function handleAnswer(selected, btn) {
      if (isProcessing) return;
      if (selected === correctAnswer) {
        isProcessing = true;
        btn.classList.add('correct');
        
        setTimeout(() => {
          if (currentStep === 1) {
            currentStep = 2;
            document.getElementById('dot1').className = 'progress-dot completed';
            document.getElementById('dot2').className = 'progress-dot active';
            document.getElementById('qCount').innerText = 'QUESTION 2 OF 2';
            generateQuestion();
          } else {
            // GUUL: Isla markiiba lacagta u shub bot-ka iyadoo aan OK la sugin!
            localStorage.setItem('last_claim_ts', Date.now().toString());
            if (tg && tg.sendData) {
              tg.sendData(JSON.stringify({ action: "claim_bonus", amount: 0.003 }));
            }

            document.getElementById('quizScreen').style.display = 'none';
            document.getElementById('verifiedScreen').style.display = 'flex';
          }
        }, 400);
      } else {
        isProcessing = true;
        btn.classList.add('wrong');
        document.getElementById('errorMsg').style.visibility = 'visible';
        setTimeout(() => { generateQuestion(); }, 700);
      }
    }

    // Marka OK la riixo (Xayeysiis Optional ah & Xiritaanka App-ka)
    async function handleClaim() {
      const claimBtn = document.getElementById('claimBtn');
      if (claimBtn) { claimBtn.innerText = "Closing..."; claimBtn.disabled = true; }

      if (AdController) {
        try { await AdController.show(); } catch (e) {}
      }

      if (tg) {
        tg.close();
      } else {
        window.close();
      }
    }

    function closeApp() {
      if (tg) { tg.close(); } else { window.close(); }
    }

    if (checkCooldown()) {
      generateQuestion();
    }
  </script>
</body>
  </html>
